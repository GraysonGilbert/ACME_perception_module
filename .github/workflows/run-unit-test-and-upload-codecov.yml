##############################################################################
#
# GitHub CI workflow: build, run unit tests, upload coverage report
# with OpenCV 4.10 source build + caching
#
##############################################################################

name: Run Unit Test and Upload Coverage Report

on:
  push:
    branches: [ "main", "iteration_2"]
  pull_request:
    branches: [ "main" ]
    types: [opened]
  workflow_dispatch:

jobs:
  build-run-upload:
    runs-on: ubuntu-24.04

    steps:
      # Checkout code WITH LFS
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Install general build dependencies
      - name: Install build packages
        run: |
          sudo apt update
          sudo apt install -y software-properties-common \
                              build-essential cmake git git-lfs pkg-config \
                              libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev \
                              libtbbmalloc2 libtbb-dev libjpeg-dev libpng-dev libtiff-dev \
                              libopenexr-dev libwebp-dev doxygen lcov gcovr cppcheck
          git lfs install
          git lfs pull

      # Sanity check: verify model artifacts are real (not LFS pointers)
      - name: Verify model artifacts
        run: |
          ls -lh app/config_files || true
          # Show file sizes; pointer files will be tiny (<1 KB)
          wc -c app/config_files/*.onnx || true
          # If these lines appear, you still have pointers:
          head -n 3 app/config_files/*.onnx | sed -n '1,3p' || true

      # Cache OpenCV install directory
      - name: Cache OpenCV 4.10
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: /opt/opencv-4.10
          key: opencv-4.10-linux

      # Build OpenCV 4.10 from source if cache missed
      - name: Build OpenCV from source
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/src && cd ~/src
          git clone --depth=1 -b 4.10.0 https://github.com/opencv/opencv.git
          git clone --depth=1 -b 4.10.0 https://github.com/opencv/opencv_contrib.git
          cmake -S opencv -B build-opencv \
              -DOPENCV_EXTRA_MODULES_PATH=~/src/opencv_contrib/modules \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/opt/opencv-4.10 \
              -DBUILD_LIST=core,imgproc,highgui,videoio,dnn \
              -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_DOCS=OFF \
              -DOPENCV_GENERATE_PKGCONFIG=ON
          cmake --build build-opencv -j"$(nproc)"
          sudo cmake --install build-opencv

      # Make OpenCV discoverable
      - name: Configure OpenCV environment
        run: |
          echo "/opt/opencv-4.10/lib" | sudo tee /etc/ld.so.conf.d/opencv.conf
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/opt/opencv-4.10/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/opencv-4.10/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      # Verify OpenCV version
      - name: Check OpenCV version
        run: pkg-config --modversion opencv4

      # Configure & build
      - name: Configure CMake flags and build executables
        run: |
          cmake -D WANT_COVERAGE=ON \
                -D CMAKE_BUILD_TYPE=Debug \
                -D OpenCV_DIR=/opt/opencv-4.10/lib/cmake/opencv4 \
                -S ./ -B build/
          cmake --build build/ --clean-first --target all test_coverage
          cat build/test_coverage.info

      # Run unit tests and fail the job if any test fails
      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          ctest --test-dir build --output-on-failure -j "$(nproc)"
          cmake --build build/ --target cppcheck

      # Upload coverage result to CodeCov
      - name: Upload coverage result to CodeCov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{github.workspace}}/build/test_coverage.info
          fail_ci_if_error: true
          verbose: true
          disable_search: true
          plugin: none
